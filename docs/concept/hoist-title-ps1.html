<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOIST title screens (PS1)</title>
<style>
  @font-face { font-family: 'Luckiest Guy'; src: url(fonts/luckiestguy.woff2) format('woff2'); }
  @font-face { font-family: 'Titan One'; src: url(fonts/titanone.woff2) format('woff2'); }
  @font-face { font-family: 'Bowlby One'; src: url(fonts/bowlbyone.woff2) format('woff2'); }
  @font-face { font-family: 'Lilita One'; src: url(fonts/lilitaone.woff2) format('woff2'); }
  body { margin: 0; background: #10223a; color: #f4ecd0; font: 16px 'Lilita One', sans-serif; padding: 16px; }
  h1 { font-weight: 400; font-size: 24px; margin: 0 0 4px; color: #ffd84a; } p { margin: 0 0 16px; max-width: 900px; color: #cfe4f4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); gap: 24px; }
  figure { margin: 0; } canvas { width: 100%; display: block; image-rendering: pixelated; box-shadow: 0 0 0 4px #ffd84a, 8px 8px 0 4px rgba(0,0,0,.4); }
  figcaption { margin-top: 12px; } figcaption b { color: #ffd84a; font-weight: 400; }
</style></head><body>
<h1>HOIST: jolly PS1 title screens</h1>
<p>The backgrounds are the real game renderer: the Pocket Pearl alone on open sea, nothing around it. In the game the ship bobs, the sail fills, the pennant flaps. The logos are drawn at the game's low resolution so they share its crunchy PS1 look.</p>
<div class="grid">
  <figure><canvas id="c1" width="1280" height="720"></canvas><figcaption><b>1 · Bunting.</b> Morning. Chunky sunshine-yellow letters with a toffee outline, a string of pennants above. The happiest of the four.</figcaption></figure>
  <figure><canvas id="c2" width="1280" height="720"></canvas><figcaption><b>2 · Sailcloth.</b> Midday. White canvas letters stitched in red, each one tilting as if filling with wind.</figcaption></figure>
  <figure><canvas id="c3" width="1280" height="720"></canvas><figcaption><b>3 · Treasure gold.</b> Afternoon sun. Gold letters on a carved-wood shadow, like a ship's nameboard. Warm and adventurous.</figcaption></figure>
  <figure><canvas id="c4" width="1280" height="720"></canvas><figcaption><b>4 · Lagoon.</b> Coral and turquoise, round and bubbly, with a little bobbing anchor. The most playful.</figcaption></figure>
</div>
<script>
const LO = 2; // logo drawn at half resolution, then scaled up with hard pixels
function low(w, h) { const c = document.createElement('canvas'); c.width = w / LO; c.height = h / LO; return c; }
function extruded(ctx, txt, x, y, { font, depth, side, outline, ow, fill, tilt = 0, letterTilt = null, spacing = 0 }) {
  ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  const letters = [...txt], widths = letters.map((l) => ctx.measureText(l).width + spacing);
  const total = widths.reduce((a, b) => a + b, 0) - spacing;
  let cx = x - total / 2;
  letters.forEach((l, i) => {
    ctx.save(); ctx.translate(cx + widths[i] / 2, y); ctx.rotate(tilt + (letterTilt ? letterTilt(i) : 0));
    const lx = -widths[i] / 2 + spacing / 2;
    for (let d = depth; d > 0; d--) { ctx.fillStyle = side; ctx.strokeStyle = side; ctx.lineWidth = ow; ctx.strokeText(l, lx + d * 0.5, d); ctx.fillText(l, lx + d * 0.5, d); }
    ctx.strokeStyle = outline; ctx.lineWidth = ow; ctx.strokeText(l, lx, 0);
    ctx.fillStyle = typeof fill === 'function' ? fill(ctx) : fill; ctx.fillText(l, lx, 0);
    ctx.restore(); cx += widths[i];
  });
}
function vgrad(ctx, y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function menu(ctx, items, x, y, col, sel, font = "22px 'Lilita One'") {
  ctx.font = font; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  items.forEach((s, i) => { const yy = y + i * 28; ctx.lineWidth = 5; ctx.strokeStyle = '#1a2a40'; ctx.strokeText(s, x, yy); ctx.fillStyle = i === sel ? '#ffd84a' : col; ctx.fillText(s, x, yy);
    if (i === sel) { ctx.fillStyle = '#e8402a'; ctx.beginPath(); const w = ctx.measureText(s).width / 2 + 14; ctx.moveTo(x - w, yy - 15); ctx.lineTo(x - w + 12, yy - 9); ctx.lineTo(x - w, yy - 3); ctx.fill(); } });
}
function compose(id, bg, draw) {
  const img = new Image(); img.onload = () => {
    const c = document.getElementById(id), ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 1280, 720);
    const l = low(1280, 720), lc = l.getContext('2d'); draw(lc);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(l, 0, 0, 1280, 720);
    window.__done = (window.__done || 0) + 1;
  }; img.src = bg;
}
document.fonts.load("80px 'Luckiest Guy'").then(() => Promise.all(["Titan One", "Bowlby One", "Lilita One"].map((f) => document.fonts.load(`80px '${f}'`)))).then(() => {
  // 1 bunting
  compose('c1', 'hoist-bg1.png', (x) => {
    x.strokeStyle = '#5a3a1c'; x.lineWidth = 2; x.beginPath(); x.moveTo(120, 24); x.quadraticCurveTo(320, 70, 520, 24); x.stroke();
    const cols = ['#e8402a', '#ffd84a', '#2fa8d8', '#5ec45a', '#ff8a3a'];
    for (let i = 0; i < 13; i++) { const t = (i + 0.5) / 13, px = 120 + 400 * t, py = 24 + 46 * 4 * t * (1 - t) * 0.5; x.fillStyle = cols[i % 5]; x.beginPath(); x.moveTo(px - 9, py); x.lineTo(px + 9, py); x.lineTo(px, py + 18); x.fill(); }
    extruded(x, 'HOIST', 320, 130, { font: "92px 'Luckiest Guy'", depth: 8, side: '#7a3a12', outline: '#4a2008', ow: 10, fill: (c) => vgrad(c, -66, 0, [[0, '#fff3a0'], [0.55, '#ffd23a'], [1, '#ff9a1a']]), letterTilt: (i) => [-0.06, 0.04, -0.03, 0.05, -0.04][i], spacing: 4 });
    menu(x, ['SET SAIL', 'NEW VOYAGE', 'SETTINGS'], 110, 270, '#ffffff', 0);
  });
  // 2 sailcloth
  compose('c2', 'hoist-bg2.png', (x) => {
    extruded(x, 'HOIST', 320, 120, { font: "88px 'Titan One'", depth: 6, side: '#1d5a8a', outline: '#c8241a', ow: 8, fill: (c) => vgrad(c, -64, 0, [[0, '#ffffff'], [1, '#e8e0cc']]), letterTilt: (i) => Math.sin(i * 1.3) * 0.12, spacing: 6 });
    x.setLineDash([4, 4]); x.strokeStyle = '#c8241a'; x.lineWidth = 2; x.beginPath(); x.moveTo(190, 142); x.lineTo(450, 142); x.stroke(); x.setLineDash([]);
    menu(x, ['SET SAIL', 'NEW VOYAGE', 'SETTINGS'], 140, 260, '#ffffff', 0);
  });
  // 3 treasure gold
  compose('c3', 'hoist-bg3.png', (x) => {
    x.fillStyle = '#6a3a18'; x.fillRect(150, 52, 340, 92); x.fillStyle = '#8a5428'; x.fillRect(156, 58, 328, 80); x.fillStyle = '#4a2810'; for (let i = 0; i < 5; i++) x.fillRect(156, 68 + i * 16, 328, 2);
    extruded(x, 'HOIST', 320, 128, { font: "76px 'Bowlby One'", depth: 5, side: '#3a1c08', outline: '#3a1c08', ow: 6, fill: (c) => vgrad(c, -56, 0, [[0, '#fff6b0'], [0.4, '#ffd23a'], [0.75, '#d08a10'], [1, '#ffe070']]), spacing: 2 });
    x.fillStyle = '#ffe070'; for (const [sx, sy] of [[140, 46], [500, 50], [496, 146]]) { x.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? 3 : 9, a = k * Math.PI / 4; x.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); } x.fill(); }
    menu(x, ['SET SAIL', 'NEW VOYAGE', 'SETTINGS'], 110, 270, '#fff4d8', 0);
  });
  // 4 lagoon
  compose('c4', 'hoist-bg4.png', (x) => {
    extruded(x, 'HOIST', 320, 118, { font: "90px 'Lilita One'", depth: 7, side: '#0d7a8a', outline: '#ffffff', ow: 10, fill: (c) => vgrad(c, -64, 0, [[0, '#ffb08a'], [1, '#ff5a6a']]), letterTilt: (i) => [0.05, -0.05, 0.06, -0.04, 0.05][i], spacing: 2 });
    // a little anchor dotting the I
    x.strokeStyle = '#0d7a8a'; x.lineWidth = 4; x.beginPath(); x.arc(328, 22, 5, 0, 6.3); x.moveTo(328, 27); x.lineTo(328, 42); x.moveTo(320, 36); x.quadraticCurveTo(328, 46, 336, 36); x.stroke();
    menu(x, ['SET SAIL', 'NEW VOYAGE', 'SETTINGS'], 110, 270, '#ffffff', 0);
  });
});
</script></body></html>
