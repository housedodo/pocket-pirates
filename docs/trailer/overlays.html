<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Pirata One'; src: url(file:///home/user/pocket-pirates/docs/concept/fonts/pirataone.woff2) format('woff2'); }
@font-face { font-family: 'DotGothic16'; src: url(file:///home/user/pocket-pirates/public/fonts/dotgothic.woff2) format('woff2'); }
html, body { margin: 0; background: transparent; }
.f { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.cap { position: absolute; left: 0; right: 0; text-align: center; font: 76px 'DotGothic16', monospace; letter-spacing: 6px; color: #fff4d8; text-shadow: 5px 5px 0 #1a0f08, -3px -3px 0 #1a0f08, 5px -3px 0 #1a0f08, -3px 5px 0 #1a0f08, 0 0 40px rgba(0,0,0,.6); }
.cap i { display: block; width: 220px; height: 8px; margin: 18px auto 0; background: #ffd23a; box-shadow: 0 0 0 4px #3a2210; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.0) 35%, rgba(0,0,0,.5) 100%); }
canvas { position: absolute; image-rendering: pixelated; }
.sub { position: absolute; left: 0; right: 0; text-align: center; font: 48px 'DotGothic16', monospace; color: #fff4d8; letter-spacing: 4px; text-shadow: 4px 4px 0 #1a0f08; }
.rib { position: absolute; left: 50%; transform: translateX(-50%); padding: 8px 34px; font: 46px 'DotGothic16', monospace; color: #3a2210; background: #ffd23a; box-shadow: 0 0 0 6px #3a2210, 8px 8px 0 6px rgba(0,0,0,.4); letter-spacing: 6px; }
</style></head><body>
<div class="f" id="logo"><div class="vig"></div><canvas id="lg" style="left:560px;top:290px;width:800px"></canvas></div>
<div class="f" id="end"><div class="vig" style="background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.25) 20%, rgba(0,0,0,.65) 100%)"></div><canvas id="le" style="left:410px;top:210px;width:1100px"></canvas><div class="sub" style="top:640px">A small ship. A big sea.</div><div class="rib" style="top:780px">PLAY THE FREE DEMO</div></div>
<div class="f" id="c1"><div class="cap" style="top:820px">Set sail.<i></i></div></div>
<div class="f" id="c2"><div class="cap" style="top:820px">Make landfall.<i></i></div></div>
<div class="f" id="c3"><div class="cap" style="top:150px">Roll the dice.<i></i></div></div>
<div class="f" id="c4"><div class="cap" style="top:820px">Keep the lantern lit.<i></i></div></div>
<div class="f" id="c5"><div class="cap" style="top:820px">Weather the storm.<i></i></div></div>
<script>
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];const hex=(h)=>[1,3,5].map((i)=>parseInt(h.slice(i,i+2),16));
let seed=9;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function logo(out,W=320,H=110){seed=9;out.width=W;out.height=H;out.style.height=(parseFloat(out.style.width)*H/W)+'px';const g=out.getContext('2d'),font="86px 'Pirata One'",cx=W/2,y=88;const face=cv(W,H),f=face.getContext('2d');f.font=font;f.textAlign='center';f.fillStyle='#fff';f.fillText('Hoist',cx,y);const tint=(col)=>{const c=cv(W,H),x=c.getContext('2d');x.drawImage(face,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,W,H);return c;};const deep=tint('#1a0606'),blood=tint('#5a1612');for(let i=6;i>0;i--)g.drawImage(i>3?deep:blood,Math.round(i*0.6),i);const md=f.getImageData(0,0,W,H).data,img=g.createImageData(W,H),d=img.data,cols=['#f4ead0','#e2d4b0','#b8a47c'].map(hex);for(let py=0;py<H;py++)for(let px=0;px<W;px++){const i=(py*W+px)*4;if(md[i+3]<128)continue;const k=(py-(y-64))/64*2+BAYER[(py%4)*4+(px%4)]/16-0.5,c=cols[Math.max(0,Math.min(2,Math.round(k)))];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}const top=cv(W,H);top.getContext('2d').putImageData(img,0,0);g.drawImage(top,0,0);g.globalCompositeOperation='destination-out';for(let i=0;i<160;i++)g.fillRect(rnd()*W|0,rnd()*H|0,1+(rnd()*2|0),1);g.globalCompositeOperation='source-atop';for(let i=0;i<240;i++){g.fillStyle=rnd()<0.5?'rgba(244,234,208,0.35)':'rgba(20,10,4,0.5)';g.fillRect(rnd()*W|0,rnd()*H|0,1,1);}g.globalCompositeOperation='source-over';}
document.fonts.load("86px 'Pirata One'").then(()=>document.fonts.load("40px 'DotGothic16'")).then(()=>document.fonts.ready).then(()=>{for(const id of ['lg','le'])logo(document.getElementById(id));document.body.dataset.ready=1;});
</script></body></html>
