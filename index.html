<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pocket Pirates</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%231b86c6%27/%3E%3Cpath d=%27M7 2h1v9H7zM8 3l5 6H8z%27 fill=%27%23fff4d8%27/%3E%3Cpath d=%27M3 11h10l-2 3H5z%27 fill=%27%23a0542c%27/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #fff7d6; --shadow: #1a1230; --panel: rgba(18, 14, 40, .62); --edge: rgba(255, 247, 214, .35); --gold: #ffd23a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0820; overflow: hidden; font-family: "Courier New", ui-monospace, monospace; color: var(--ink); -webkit-user-select: none; user-select: none; touch-action: none; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    .txt { font-weight: 700; letter-spacing: .06em; text-shadow: 2px 2px 0 var(--shadow), -1px -1px 0 var(--shadow), 1px -1px 0 var(--shadow), -1px 1px 0 var(--shadow); }
    .panel { background: var(--panel); border: 2px solid var(--edge); box-shadow: 3px 3px 0 rgba(0,0,0,.45); padding: 6px 10px; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud.hidden > * { display: none !important; }
    #stats { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
    #near { color: #bff; min-height: 1.2em; font-size: 13px; }
    #gold b { color: var(--gold); }
    #compass { position: absolute; right: 12px; top: 12px; width: 124px; text-align: center; font-size: 12px; padding: 4px; }
    #compass canvas { width: 108px; height: 108px; display: block; margin: 0 auto 2px; image-rendering: pixelated; }
    #sailbar { position: absolute; right: 12px; top: 164px; width: 124px; font-size: 12px; text-align: center; }
    #sailbar .bar { height: 10px; background: #0007; border: 2px solid var(--edge); margin-top: 3px; }
    #sailbar .fill { height: 100%; width: 70%; background: var(--gold); }
    #prompt { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 16px; text-align: center; display: none; }
    #prompt .bar { height: 8px; margin-top: 6px; background: #0007; border: 2px solid var(--edge); display: none; }
    #prompt .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
    #toasts { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); width: min(560px, 90vw); display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast { padding: 8px 12px; font-size: 15px; text-align: center; animation: pop .25s ease-out; }
    .toast.dark { border-color: #ff70d0; color: #ffd8f4; }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    #help { position: absolute; left: 12px; bottom: 12px; font-size: 12px; line-height: 1.5; transition: opacity 1.5s; }
    #debug { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); font-size: 12px; display: none; }
    #chart { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 6, 22, .72); }
    #chart.open { display: flex; }
    #chart .sheet { display: flex; gap: 14px; max-width: 96vw; max-height: 92vh; padding: 14px; background: #d9bf86; color: #3a2412; border: 4px solid #6b4a2e; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
    #chart canvas { width: min(60vh, 56vw); height: min(60vh, 56vw); image-rendering: pixelated; background: #2a8fc0; border: 3px solid #6b4a2e; }
    #chart .list { width: 250px; overflow: auto; font-size: 13px; line-height: 1.4; }
    #chart h2 { margin: 0 0 6px; font-size: 17px; }
    #chart .loot { color: #7a2a6a; }
    #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, rgba(60, 130, 210, .55), rgba(11, 8, 32, .92)); text-align: center; z-index: 5; cursor: pointer; }
    #title h1 { font-size: clamp(34px, 8vw, 78px); margin: 0; letter-spacing: .12em; color: var(--gold); }
    #title p { margin: 0; font-size: clamp(13px, 2.4vw, 18px); }
    #title .blink { animation: blink 1.2s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    #touch { position: fixed; inset: auto 0 0 0; height: 40%; pointer-events: none; display: none; }
    #touch button { pointer-events: auto; position: absolute; width: 64px; height: 64px; border-radius: 12px; font: 700 26px monospace; color: var(--ink); background: var(--panel); border: 2px solid var(--edge); }
    @media (pointer: coarse) { #touch { display: block; } #help { display: none; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="stats" class="txt">
      <div class="panel" id="gold">&#9875; Gold <b>0</b></div>
      <div class="panel" id="found">Isles charted: <b>0</b></div>
      <div id="near"></div>
    </div>
    <div id="compass" class="panel txt"><canvas id="compassCv" width="54" height="54"></canvas><div id="windtxt">WIND</div></div>
    <div id="sailbar" class="panel txt"><div>SAILS</div><div class="bar"><div class="fill" id="sailfill"></div></div><div id="eff"></div></div>
    <div id="prompt" class="panel txt"><div id="prompttxt"></div><div class="bar"><i></i></div></div>
    <div id="toasts"></div>
    <div id="help" class="txt panel">A/D steer &middot; W/S sails &middot; E interact<br>M chart &middot; drag = tilt &middot; wheel = zoom &middot; H hide HUD</div>
    <div id="debug" class="panel txt"></div>
  </div>
  <div id="chart"><div class="sheet"><canvas id="chartCv" width="300" height="300"></canvas><div class="list" id="chartList"></div></div></div>
  <div id="touch">
    <button id="tL" style="left:12px;bottom:84px">&#9664;</button><button id="tR" style="left:92px;bottom:84px">&#9654;</button>
    <button id="tU" style="right:92px;bottom:84px">&#9650;</button><button id="tD" style="right:12px;bottom:84px">&#9660;</button>
    <button id="tE" style="right:50%;margin-right:-32px;bottom:14px">E</button>
  </div>
  <div id="title" class="txt"><h1>POCKET PIRATES</h1><p>Sail the sunny seas. Chart the isles. Don't look down.</p><p class="blink">&mdash; click or press any key to set sail &mdash;</p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
